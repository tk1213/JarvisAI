[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "0.3.0"
description = "A production-oriented JARVIS-style AI assistant"
requires-python = ">=3.12"

dependencies = [
    "loguru",
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "openai",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]